version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: wp-pdev-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wp-network
    ports:
      - "${MYSQL_PORT}:3306"

  # WordPress
  wordpress:
    depends_on:
      - db
    image: wordpress:latest
    container_name: wp-pdev-wordpress
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DEBUG: '${WORDPRESS_DEBUG}'
      WORDPRESS_DEBUG_LOG: '${WORDPRESS_DEBUG_LOG}'
      WORDPRESS_DEBUG_DISPLAY: '${WORDPRESS_DEBUG_DISPLAY}'
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', true);
        define('WP_ENVIRONMENT_TYPE', 'local');
        @ini_set('display_errors', 0);
    ports:
      - "${WORDPRESS_PORT}:80"
    volumes:
      - wordpress_data:/var/www/html
      - ./plugins:/var/www/html/wp-content/plugins
      - ./themes:/var/www/html/wp-content/themes
      - ./uploads:/var/www/html/wp-content/uploads
      - ./debug.log:/var/www/html/wp-content/debug.log
    networks:
      - wp-network

  # WP-CLI
  wpcli:
    depends_on:
      - db
      - wordpress
    image: wordpress:cli
    container_name: wp-pdev-cli
    user: xfs
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
    volumes:
      - wordpress_data:/var/www/html
      - ./plugins:/var/www/html/wp-content/plugins
      - ./themes:/var/www/html/wp-content/themes
      - ./uploads:/var/www/html/wp-content/uploads
    networks:
      - wp-network
    entrypoint: ["tail", "-f", "/dev/null"]

  # MailCatcher for email testing
  mailcatcher:
    image: schickling/mailcatcher:latest
    container_name: wp-pdev-mailcatcher
    restart: unless-stopped
    ports:
      - "${MAILCATCHER_SMTP_PORT}:1025"
      - "${MAILCATCHER_WEB_PORT}:1080"
    networks:
      - wp-network

volumes:
  db_data:
  wordpress_data:

networks:
  wp-network:
    driver: bridge